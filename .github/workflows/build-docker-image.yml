name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Server performance regression check (loose budgets)
        run: npm run bench -- --check

      - name: Build application
        run: npm run build

      - name: Run CDP browser quality audit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/log-viewer-cdp"
          PORT=15180 ENABLE_DEMO=true ENABLE_SAMPLES=true npm start >"$RUNNER_TEMP/log-viewer-cdp/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:15180/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15180/healthz >/dev/null
          CHROME="$(command -v google-chrome)" \
            BASE=http://127.0.0.1:15180 \
            ARTIFACT_DIR="$RUNNER_TEMP/log-viewer-cdp" \
            npm run test:cdp

      - name: Upload CDP audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cdp-quality-audit
          path: ${{ runner.temp }}/log-viewer-cdp
          retention-days: 14

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

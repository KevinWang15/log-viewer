<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='7' cy='7' r='6' fill='%23e8730c'/><rect x='10.5' y='9.5' width='5' height='2.4' rx='1' transform='rotate(45 10.5 9.5)' fill='%232b3648'/></svg>" />
    <title>log-viewer</title>
    <script type="module" crossorigin src="./assets/main-Gkl_WOMM.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/detail-DGXQZo4A.js">
    <link rel="stylesheet" crossorigin href="./assets/styles-CquOUi5n.css">
  </head>
  <body>
    <div id="app">
      <div id="menubar" role="toolbar" aria-label="Application actions">
        <span class="app-icon" aria-hidden="true">🔍</span>
        <button type="button" class="menu" id="menu-file">File</button>
        <button type="button" class="menu" id="menu-filter">Filter</button>
        <button type="button" class="menu" id="menu-tools">Tools</button>
        <button type="button" class="menu" id="menu-report">Report</button>
        <button type="button" class="menu" id="menu-view" aria-pressed="true" title="Toggle entry detail">View</button>
        <span class="menu-title" id="win-title">log-viewer</span>
      </div>
      <div id="toolbar"></div>
      <div id="body">
        <div id="sidebar">
          <div id="tree-panel">
            <div class="panel-header">Log Files &amp; Filters <span class="pin" aria-hidden="true">📌</span></div>
            <div id="tree" role="tree" aria-label="Open log sources and filters"></div>
          </div>
          <div id="stats-panel"></div>
        </div>
        <div id="main">
          <div id="grid-wrap">
            <div id="grid"></div>
            <div id="welcome" hidden>
              <div class="welcome-box">
                <h2>Quick and clear log analysis.</h2>
                <p>Open a log file to search, filter, tail and more.</p>
                <button id="welcome-open" class="btn-primary">OPEN LOG FILE</button>
                <button id="welcome-demo" class="btn-secondary">VIEW LIVE DEMO STREAM</button>
              </div>
            </div>
          </div>
          <div id="detail"></div>
        </div>
        <div id="navstrip"><canvas id="minimap" role="scrollbar" tabindex="0" aria-label="Log overview; use arrow keys to move" aria-controls="grid" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></canvas></div>
      </div>
      <div id="statusbar" role="status" aria-live="polite"><span id="status-left"></span><span id="status-right"></span></div>
    </div>

    <div id="modal-backdrop" hidden>
      <div id="file-modal" role="dialog" aria-modal="true" aria-labelledby="file-modal-title">
        <div class="modal-title" id="file-modal-title">Open Log File</div>
        <div class="modal-path">
          <button type="button" id="fm-up" title="Parent directory" aria-label="Parent directory">⬆</button>
          <label class="sr-only" for="fm-path">Directory path</label>
          <input id="fm-path" aria-label="Directory path" spellcheck="false" />
          <button type="button" id="fm-go">Go</button>
          <button type="button" id="fm-samples" title="Sample logs">Samples</button>
        </div>
        <div id="fm-list"></div>
        <div class="modal-footer"><button type="button" id="fm-cancel">Cancel</button></div>
      </div>
    </div>

  </body>
</html>
